<!DOCTYPE html>
<html>

<head>

    <title>Contact Us</title>

<link rel="stylesheet" href="styles/index-header.css">
<link rel="stylesheet" href="styles/Page5-contact-us.css">

</head>


<body>

    <header class="header">
        <div class="left-section">
            <div class="logo-container">
                <img class="main-logo"
                     src="logos/main-logo.jpg">

            </div>

        </div>


        <div class="right-section">
            <a class="header-link"
               href="/web-dev-project-2/index.html">
                <div class="home-button">
                    Home
                </div>

            </a>


            <a class="header-link"
               href="/web-dev-project-2/Page3-productsandservices.html">
                <div class="menu-button">
                    Products & Services
                </div>

            </a>


            <a class="header-link"
               href="/web-dev-project-2/Page4-Gallery.html">
                <div class="location-button">
                    Gallery

                </div>
            </a>


            <a class="header-link"
               href="/Page2-aboutus.html">
                <div class="about-button">
                    About Us

                </div>
            </a>


            <a class="header-link"
               href="/Page5-contactus.html">
                <div class="contact-button">
                    Contact Us

                </div>
            </a>
        </div>
    </header>

    <main class="contact-section">
        <div class="contact-container">
            <div class="contact-heading">


                <h1>Contact Us</h1>

                <p>
                    Have a question, suggestion, or inquiry?
                    Fill out the form below and let us know how
                    we can help you.
                </p>

            </div>


            <form class="contact-form">
                <div class="form-group">
                    <label for="first-name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first-name"
                        name="first-name"
                        placeholder="Enter your first name"
                        required>

                </div>


                <div class="form-group">
                    <label for="last-name">
                        Last Name
                    </label>
                    <input
                        type="text"
                        id="last-name"
                        name="last-name"
                        placeholder="Enter your last name"
                        required>

                </div>


                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required>

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09XX XXX XXXX">

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password">

                </div>

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="1"
                        max="120"
                        placeholder="Enter your age">

                </div>


                <div class="form-group">

                    <label for="date">
                        Preferred Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date">

                </div>



                <!-- TIME -->

                <div class="form-group">

                    <label for="time">
                        Preferred Time
                    </label>

                    <input
                        type="time"
                        id="time"
                        name="time">

                </div>



                <!-- RADIO BUTTONS -->

                <div class="form-group">

                    <label>
                        What is your inquiry about?
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="inquiry"
                                value="reservation">

                            Reservation
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="inquiry"
                                value="feedback">

                            Feedback
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="inquiry"
                                value="general">

                            General Inquiry
                        </label>

                    </div>

                </div>



                <!-- CHECKBOXES -->

                <div class="form-group">

                    <label>
                        What would you like to know about?
                    </label>

                    <div class="checkbox-group">

                        <label>
                            <input
                                type="checkbox"
                                name="interest"
                                value="food">

                            Food & Drinks
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="interest"
                                value="events">

                            Events
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="interest"
                                value="services">

                            Services
                        </label>

                    </div>

                </div>



                <!-- DROPDOWN -->

                <div class="form-group">

                    <label for="contact-method">
                        Preferred Contact Method
                    </label>

                    <select
                        id="contact-method"
                        name="contact-method">

                        <option value="">
                            Select an option
                        </option>

                        <option value="email">
                            Email
                        </option>

                        <option value="phone">
                            Phone
                        </option>

                        <option value="message">
                            Message
                        </option>

                    </select>

                </div>



                <!-- TEXTAREA -->

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message here..."></textarea>

                </div>



                <!-- FILE UPLOAD -->

                <div class="form-group">

                    <label for="file">
                        Upload a File
                    </label>

                    <input
                        type="file"
                        id="file"
                        name="file">

                </div>



                <!-- BUTTONS -->

                <div class="button-group">

                    <button
                        type="submit"
                        class="submit-button">

                        Submit

                    </button>


                    <button
                        type="reset"
                        class="reset-button">

                        Reset

                    </button>

                </div>


            </form>

        </div>

    </main>


</body>

</html>
